<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f6f5f0"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="76" y="102" fill="#252823" font-size="28" letter-spacing="3">GARAGE HOUSE NAVI</text><text x="1004" y="102" fill="#252823" font-size="22" text-anchor="end">03</text><path d="M76 140H1004" stroke="#252823" stroke-width="1.5"/><text x="76" y="230" fill="#252823" font-size="22" letter-spacing="2">YOUR NEXT GARAGE</text><text x="76" y="330" fill="#252823" font-size="58" >探している住まいが、</text><text x="76" y="413" fill="#252823" font-size="58" >まだ見つからない方へ。</text><text x="76" y="485" fill="#252823" font-size="27" >希望条件から、ASC不動産へご相談ください。</text><rect x="76" y="552" width="928" height="442" fill="#252823"/><text x="117" y="622" fill="#f6f5f0" font-size="29" >ご相談の前に、この４つを。</text><path d="M117 661H963" stroke="#676c61" stroke-width="1.5"/><text x="117" y="738" fill="#f6f5f0" font-size="35" >01  希望エリア</text><text x="588" y="738" fill="#f6f5f0" font-size="35" >02  毎月の予算</text><text x="117" y="856" fill="#f6f5f0" font-size="35" >03  車種・台数</text><text x="588" y="856" fill="#f6f5f0" font-size="35" >04  入居希望時期</text><text x="117" y="949" fill="#f6f5f0" font-size="23" >「必須」と「できれば」に分けると、相談がスムーズに。</text><text x="76" y="1070" fill="#252823" font-size="32" >プロフィールのリンクから</text><text x="76" y="1127" fill="#252823" font-size="40" >「物件リクエスト」へ。</text><text x="76" y="1180" fill="#565a52" font-size="22" >ご紹介できる物件は募集状況によって異なります。</text><path d="M76 1220H1004" stroke="#252823" stroke-width="1.5"/><text x="76" y="1272" fill="#252823" font-size="24" >garagehouse-navi.com</text><text x="1004" y="1272" fill="#252823" font-size="20" text-anchor="end">運営：ASC不動産</text></g></svg>