<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f6f5f0"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="76" y="102" fill="#252823" font-size="28" letter-spacing="3">GARAGE HOUSE NAVI</text><text x="1004" y="102" fill="#252823" font-size="22" text-anchor="end">02</text><path d="M76 140H1004" stroke="#252823" stroke-width="1.5"/><text x="76" y="228" fill="#252823" font-size="22" letter-spacing="2">BEFORE YOU CHOOSE</text><text x="76" y="332" fill="#252823" font-size="64" >写真のほかに、</text><text x="76" y="418" fill="#252823" font-size="64" >見ておきたい５つ。</text><text x="76" y="485" fill="#252823" font-size="27" >ガレージハウス探しのチェックリスト</text><text x="76" y="590" fill="#252823" font-size="23" >01</text><text x="158" y="590" fill="#252823" font-size="34" >毎月の支払総額</text><text x="158" y="633" fill="#565a52" font-size="24" >賃料だけでなく、管理費なども確認</text><path d="M158 657H1004" stroke="#d4d5ce" stroke-width="1.5"/><text x="76" y="705" fill="#252823" font-size="23" >02</text><text x="158" y="705" fill="#252823" font-size="34" >車・バイクの台数</text><text x="158" y="748" fill="#565a52" font-size="24" >持っている車種と一緒に整理</text><path d="M158 772H1004" stroke="#d4d5ce" stroke-width="1.5"/><text x="76" y="820" fill="#252823" font-size="23" >03</text><text x="158" y="820" fill="#252823" font-size="34" >ガレージの使い方</text><text x="158" y="863" fill="#565a52" font-size="24" >保管・作業など、希望を具体的に</text><path d="M158 887H1004" stroke="#d4d5ce" stroke-width="1.5"/><text x="76" y="935" fill="#252823" font-size="23" >04</text><text x="158" y="935" fill="#252823" font-size="34" >普段の移動</text><text x="158" y="978" fill="#565a52" font-size="24" >通勤や買い物の道のりを確認</text><path d="M158 1002H1004" stroke="#d4d5ce" stroke-width="1.5"/><text x="76" y="1050" fill="#252823" font-size="23" >05</text><text x="158" y="1050" fill="#252823" font-size="34" >内見での動き</text><text x="158" y="1093" fill="#565a52" font-size="24" >車の出し入れと室内への移動</text><path d="M158 1117H1004" stroke="#d4d5ce" stroke-width="1.5"/><text x="76" y="1190" fill="#565a52" font-size="23" >利用条件は物件ごとに確認しましょう。</text><path d="M76 1220H1004" stroke="#252823" stroke-width="1.5"/><text x="76" y="1272" fill="#252823" font-size="24" >garagehouse-navi.com</text><text x="1004" y="1272" fill="#252823" font-size="20" text-anchor="end">運営：ASC不動産</text></g></svg>