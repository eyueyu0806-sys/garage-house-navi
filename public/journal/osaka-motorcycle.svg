<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">大阪でバイク可のガレージハウスを選ぶ4つの確認</title>
  <desc id="desc">車両情報、利用条件、現地確認、防犯と契約を順に確認する編集部制作の図解</desc>
  <rect width="1200" height="630" fill="#f4f2ed"/>
  <path d="M0 0h1200v12H0z" fill="#17191b"/>
  <g fill="none" stroke="#d9d5ce">
