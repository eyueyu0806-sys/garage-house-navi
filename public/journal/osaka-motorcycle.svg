      <text x="0" y="142" fill="#5c5a55" font-size="15">車名・排気量・台数</text>
      <text x="0" y="169" fill="#5c5a55" font-size="15">増車・買替えの予定</text>
      <path d="M4 221h172" stroke="#17191b"/>
      <circle cx="40" cy="257" r="12" fill="none" stroke="#17191b" stroke-width="4"/>
