  </g>
  <text x="74" y="67" fill="#77736d" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" letter-spacing="3">GARAGE LIFE / OSAKA</text>
  <text x="74" y="117" fill="#17191b" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">「バイク可」を、4つの確認に分ける。</text>
  <text x="74" y="148" fill="#5c5a55" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">募集表示だけで決めず、使い方を伝えて現地と書面で確かめる</text>

