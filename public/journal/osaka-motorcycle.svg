      <text x="32" y="39" text-anchor="middle" fill="#f4f2ed" font-size="22" font-weight="700">02</text>
      <text x="0" y="106" fill="#17191b" font-size="21" font-weight="700">利用条件</text>
      <text x="0" y="142" fill="#5c5a55" font-size="15">始動・整備・洗車</text>
