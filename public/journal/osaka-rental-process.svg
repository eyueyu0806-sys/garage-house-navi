    <text x="64" y="124" font-size="40" font-weight="600" letter-spacing="1">FROM INQUIRY TO KEY HANDOVER.</text>
    <text x="64" y="161" font-size="18" letter-spacing="1" fill="#62675f">A PRACTICAL CHECKPOINT GUIDE FOR RENTERS.</text>
