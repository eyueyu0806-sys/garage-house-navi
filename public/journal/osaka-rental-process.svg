<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">問い合わせから鍵の受け取りまで、賃貸の確認ステップ</title>
  <desc id="desc">希望を伝える、条件を確認する、内見する、申込みをする、説明と契約内容を確認する、鍵を受け取るという流れを示すオリジナル図解。特定の物件ではありません。</desc>
