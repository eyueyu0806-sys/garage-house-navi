<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Map first, decide with context</title>
  <desc id="desc">An original four-step editorial diagram showing address, hazard layers, evacuation route, and questions before choosing a garage house in Osaka.</desc>
  <rect width="1200" height="630" fill="#f2f0eb"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#191b19" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="104" fill="#5d625d" font-size="15" letter-spacing="4">GARAGE HOUSE NAVI / OSAKA GUIDE</text>
    <text x="88" y="177" fill="#191b19" font-size="50" font-weight="700" letter-spacing="1">MAP FIRST.</text>
    <text x="88" y="231" fill="#191b19" font-size="50" font-weight="700" letter-spacing="1">DECIDE WITH CONTEXT.</text>
    <line x1="88" y1="274" x2="1112" y2="274" stroke="#191b19"/>
    <g transform="translate(88 318)">
      <text x="0" y="0" fill="#5d625d" font-size="14" letter-spacing="2">01 / ADDRESS</text>
      <path d="M35 41c-21 0-37 16-37 37 0 28 37 66 37 66s37-38 37-66c0-21-16-37-37-37z" fill="#191b19"/>
      <circle cx="35" cy="78" r="12" fill="#f2f0eb"/>
      <text x="0" y="179" fill="#191b19" font-size="19" font-weight="700">EXACT LOCATION</text>
      <text x="0" y="205" fill="#5d625d" font-size="13">CHECK THE RIGHT POINT</text>
    </g>
    <g transform="translate(349 318)">
      <text x="0" y="0" fill="#5d625d" font-size="14" letter-spacing="2">02 / LAYERS</text>
      <rect x="0" y="45" width="72" height="72" fill="#191b19"/>
      <path d="M14 100l18-23 13 12 14-22" fill="none" stroke="#f2f0eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 58h50M11 70h19" stroke="#f2f0eb" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="179" fill="#191b19" font-size="19" font-weight="700">HAZARD TYPES</text>
      <text x="0" y="205" fill="#5d625d" font-size="13">READ EACH LEGEND</text>
    </g>
    <g transform="translate(610 318)">
      <text x="0" y="0" fill="#5d625d" font-size="14" letter-spacing="2">03 / ROUTE</text>
      <circle cx="36" cy="81" r="36" fill="#191b19"/>
      <path d="M16 95c13-30 21 9 38-24M49 61l8 11-13 5" fill="none" stroke="#f2f0eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="179" fill="#191b19" font-size="19" font-weight="700">EVACUATION</text>
      <text x="0" y="205" fill="#5d625d" font-size="13">PLACE / PATH / TIMING</text>
    </g>
    <g transform="translate(871 318)">
      <text x="0" y="0" fill="#5d625d" font-size="14" letter-spacing="2">04 / QUESTIONS</text>
      <rect x="0" y="45" width="72" height="72" rx="36" fill="#191b19"/>
      <text x="36" y="98" text-anchor="middle" fill="#f2f0eb" font-size="48" font-weight="700">?</text>
      <text x="0" y="179" fill="#191b19" font-size="19" font-weight="700">BEFORE CONTRACT</text>
      <text x="0" y="205" fill="#5d625d" font-size="13">MAP / BUILDING / PLAN</text>
    </g>
    <line x1="88" y1="535" x2="1112" y2="535" stroke="#191b19"/>
    <text x="88" y="562" fill="#5d625d" font-size="12" letter-spacing="2">ORIGINAL EDITORIAL DIAGRAM / NOT A PROPERTY PHOTO OR HAZARD MAP</text>
  </g>
</svg>
